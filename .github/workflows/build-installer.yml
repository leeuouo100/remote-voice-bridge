name: Build Windows Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# 这些自检脚本有中文输出（"OK 32 个目标动作 / ..."），而 windows-latest 上
# Python 的 stdout 默认跟随系统代码页 cp1252 —— print 中文会直接抛
# UnicodeEncodeError，把构建挂在一行和业务逻辑毫无关系的 print 上。
# 脚本内部也各自钉了编码（tools/_utf8.py），这里是兜底。
env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      # 版本号只在 config.py 里写一次，tag 触发时校验两者一致。
      # 不校验的话会出"tag 是 v1.0.3、装出来还显示 1.0.2"这种需要重新发版才能修的事故。
      #
      # ⚠ 校验**只在 tag 触发时**做。`workflow_dispatch` 手动跑的是分支
      #   （`github.ref_name` 形如 `main`），拿它当版本号比永远不可能相等 ——
      #   之前没分这个岔，导致工作流虽然声明了 `workflow_dispatch`，
      #   手动触发却必定在第一步抛异常，等于这个入口是死的。
      - name: Resolve & verify version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $line = Select-String -Path config.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw "config.py 里找不到 APP_VERSION" }
          $appVer = $line.Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagVer = $ref.TrimStart('v')
            Write-Host "tag=$tagVer   config.APP_VERSION=$appVer"
            if ($tagVer -ne $appVer) {
              throw "版本号不一致：tag=$tagVer，但 config.py APP_VERSION=$appVer。请先把 config.py 改成 $tagVer 再打 tag。"
            }
          } else {
            Write-Host "非 tag 触发（ref_type=${{ github.ref_type }}，ref=$ref）—— 以 config.py 为准：$appVer"
          }
          "version=$appVer" >> $env:GITHUB_OUTPUT

      # config.py 与 installer.iss 的版本号必须一致（tag 只在上面那步校验了 config.py）
      - name: Version consistency
        run: python tools/check_version.py

      # 映射目标表 / 遥控器按键名 / 录制键名三张表互相对得上吗 —— 纯静态校验，先拦住
      # "下拉框里出现了后端不认识的取值"这类要等用户改完映射才暴露的问题。
      # 注意：tools/check_injection.py（真的注入按键）故意不进 CI ——
      # runner 没有交互桌面会话，在那里跑没有意义。
      - name: Keymap table check
        run: python tools/check_keymap.py

      # 控制台是纯 GUI 代码，只有人点开才执行 —— 控件名写错、变量漏定义
      # 这类问题不在这里拦下来，就要等用户装完点「控制台」才炸。
      # 脚本在 Tk 起不来的环境里会自动跳过（返回 0），不会误报。
      - name: Console smoke test
        run: python tools/smoke_console.py

      # 遥控器的 HID 判定链：厂商自定义页（0xFF00+）Windows 不处理、键盘页会被处理。
      # 这条判定改错，诊断报告就会把用户指向**错误的修法**（去改映射表，
      # 而真正该做的是自己解厂商页的报告）。纯静态 + 假数据，runner 上可跑。
      - name: HID judgement check
        run: python tools/check_hidinfo.py

      # 厂商页按键解码（v1.0.11 起按键映射全靠这一路）。
      # 纯静态 + 假数据，不需要真遥控器：解码表错一位就是「按上键出来的是返回」，
      # 报告格式（reportID=0x01 / 第 2 字节是用法码 / 0=松手）错了的话，
      # 现象和"遥控器没连上"一模一样 —— 必须在 CI 里就钉死。
      - name: Remote HID decode check
        run: python tools/check_remote_hid.py

      # 按键旁路（v1.0.20）：报告不是没发，是在 WUDFHost.exe 内部就被 UMDF 驱动
      # 消费掉了 —— 这是真机上**唯一**能拿到遥控器按键的那一路。
      # 它的失效全是静默的（注入失败 / 挂错宿主 / 报告格式不对，现象都是"按了没反应"），
      # 所以把能脱离硬件验证的那一半钉死：消费类页 usage 表与 config 一一对齐、
      # 两种报告格式的解码、抹除算法、.js 与 .py 的 IOCTL 常量不漂移。带反例自证。
      # 纯静态 + 假数据：不需要真遥控器，也不需要装 frida。
      - name: Frida tap decode check
        run: python tools/check_frida_tap.py

      # 语音会话 + 音频链路（v1.0.22 补进 CI）。
      #
      # ⚠ 这四道以前**只在本地 check_all 里跑**，而 CI 是"用户能不能拿到"的唯一守门人 ——
      #   本地绿、CI 不跑 = 发出去的包没人验。这正是审查报告 P1-10 指出的
      #   "CI 与声称的闸门不一致"。
      #
      # 四道各钉一件事，全都是**静默失效**（不崩、不报错，只是不工作）：
      #   · check_voice_session  ：会话收尾归一 —— 6 条收尾路径必须都发 MIC_CLOSE、
      #                            撤 stream_active。漏一条 = 遥控器继续推流
      #                            （真机实测：结束后又多推了 52 秒）。
      #   · check_mixer_read     ：混音取数不许丢样本 —— 老写法每块丢 76%，
      #                            房间里那一路变成约 67Hz 的嗡嗡声，语音识别直接崩。
      #   · check_atvv_decode    ：v0.4 分支的 logger 必须存在（否则 NameError
      #                            把该版本的所有音频帧全吃掉）。
      #   · check_send_after_voice：语音结束后的自动发送（默认关，不许替用户发话）。
      # 都是纯静态 / 行为级 + 反例自证，不需要真遥控器、不需要声卡。
      - name: Voice session & audio checks
        run: |
          python tools/check_voice_session.py
          python tools/check_mixer_read.py
          python tools/check_atvv_decode.py
          python tools/check_send_after_voice.py
          python tools/check_input_device.py

      # spec / installer.iss 的一致性：诊断工具必须真的被打进安装包。
      # 以前只在本地 check_all 里跑，挪进 CI —— 它是"用户能不能拿到"的唯一守门人。
      # --selftest 一起跑：4 条反例验证这道闸自己会不会红（含"漏收 frida_tap.js"
      # 和"漏收 frida_hid"—— 那两种洞的现象都是「语音正常、按键全不灵」）。
      - name: Packaging entry check
        run: |
          python tools/check_packaging.py
          python tools/check_packaging.py --selftest

      # 仓库根目录 .bat 的两条一致性：① 凡"自己挑解释器"的 bat，Python 候选必须逐项同序
      # ② 会打印非 ASCII 的行必须自己声明 chcp。两条都会让「用户双击一下」直接失败，
      # 而失败的往往正是他此刻最需要的那一步（先 `修复蓝牙配对.bat`、再 `测遥控器按键通道.bat`）。
      # v1.0.15 真机踩到：四个 bat 各写各的探测，而本机没有 .venv、PATH 上那个 python
      # 又没装 bleak/winsdk ⇒ 同一台机器上「一个工具能跑、另一个报当前 Python 跑不起来」。
      # 连 --selftest 一起跑：7 条反例验证这道闸自己会不会红（含 2 条专门防假红）。
      - name: Bat env consistency check
        run: |
          python tools/check_bat_env.py
          python tools/check_bat_env.py --selftest

      - name: Build with PyInstaller
        run: pyinstaller remote-voice-bridge.spec --noconfirm

      # ── 构建后真验证：这个包**里面**到底有什么 ──────────────────────────
      # 为什么必须真跑一次：PyInstaller 在 INFO 级别**只记录入口脚本**
      # （日志里有 `Analyzing …\tray_app.py` / `…\tools\diag_remote.py`），
      # 普通被 import 的模块在日志里一个字都没有 —— 光看日志分不清
      # "打进去了"和"漏了"。而漏掉的表现全在**用户侧**：
      # 诊断报告里少掉【结论 0】，或直接提示"本版本没带上 hidinfo 模块"。
      # v1.0.5 就栽在这个盲区：诊断工具压根没进安装包，CI 却全绿。
      # 所以这里把打好的 exe 真的跑起来，用它自己的输出当证据。
      - name: Verify packaged bundle
        shell: pwsh
        run: |
          $dir  = "dist\RemoteVoiceBridge"
          $diag = "$dir\RemoteVoiceBridgeDiag.exe"
          $main = "$dir\RemoteVoiceBridge.exe"
          if (-not (Test-Path $diag)) { throw "诊断 EXE 没打出来：$diag" }
          if (-not (Test-Path $main)) { throw "主程序没打出来：$main" }

          # ① --hid：不按任何键、也不依赖插着真遥控器，适合 CI。
          #    退出码 1 表示"本机没查到 HID 集合"，runner 上可能发生 ——
          #    我们要验的是**代码在不在包里**，所以看输出内容，不看退出码。
          $hid = & $diag --hid 2>&1 | Out-String
          $global:LASTEXITCODE = 0          # 见下方说明，必须清零
          if ($hid -match '本版本没带上') { throw "包里的诊断工具缺少 hidinfo 模块" }
          if ($hid -notmatch '结论 0')     { throw "诊断工具没输出【结论 0】（hidinfo 没跑起来）" }

          # ② --selftest：报告生成器自检，不需要真机。
          #    它一次验到**两个**新模块 —— 报告里的【结论 0】要 hidinfo，
          #    【结论 4】要 hidwatch，少任何一个对应断言必失败。
          #    所以这一步同时证明"hidinfo 和 hidwatch 都进了包"。
          $st = & $diag --selftest 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $st
          # GitHub Actions 的 pwsh 会在步骤末尾 `exit $LASTEXITCODE`，
          # 不清零的话上面那个"退出码 1"会把整个构建判失败。
          $global:LASTEXITCODE = 0
          if ($code -ne 0) { throw "打包版 --selftest 失败（退出码 $code）" }
          if ($st -notmatch 'DIAG SELFTEST OK') { throw "打包版 --selftest 没打印 OK" }

          # ③ 按键旁路（v1.0.20）：真机上**唯一**能拿到遥控器按键的那一路。
          #    它的失效是静默的 —— 现象是「语音完全正常、除语音键外的按键一个都不灵」，
          #    用户只会觉得"按键又坏了"，而日志里就一行 warning。
          #    所以这里不看日志、直接证明**产物里真有它**：
          #      · frida_tap.js        Frida 脚本本体（spec 的 tap_datas 收的）
          #      · frida 原生扩展      没有它 frida_hid 会优雅降级成空转
          #    递归找，不写死 `_internal` 这一层（PyInstaller 的 onedir 布局会变）。
          $tap = @(Get-ChildItem -Path $dir -Recurse -Filter 'frida_tap.js' -ErrorAction SilentlyContinue)
          if ($tap.Count -eq 0) {
            throw "包里没有 frida_tap.js —— 按键旁路会静默失效（语音仍正常、按键全不灵）"
          }
          $core = @(Get-ChildItem -Path $dir -Recurse -Filter '_frida*.pyd' -ErrorAction SilentlyContinue)
          if ($core.Count -eq 0) {
            throw "包里没有 frida 原生扩展（_frida*.pyd）—— frida_hid 会降级成空转，按键不生效"
          }

          Write-Host "✅ 打包产物已验证：hidinfo + hidwatch 都在包里，--hid / --selftest 都能跑"
          Write-Host "✅ 按键旁路已进包：$($tap[0].FullName)"
          Write-Host "✅ frida 原生扩展已进包：$($core[0].FullName)"

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found, installing..."
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Using ISCC: $iscc"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer.iss"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteVoiceBridge-Setup
          path: installer/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
          generate_release_notes: true
